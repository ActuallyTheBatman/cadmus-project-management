<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadmus Resource Reporting | Cadmus Project Management</title>
  <meta name="description" content="Cadmus Project Management resource reporting portal.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://cadmusprojects.com/timesheets/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #07090c;
      color: #f5f1e8;
      font-family: Inter, Arial, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(245, 241, 232, 0.14);
      border-radius: 12px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.03);
      text-align: center;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214, 168, 71, 0.6);
      border-radius: 50%;
      color: #f2d98a;
      font-family: Georgia, serif;
      font-weight: 700;
      background: rgba(214, 168, 71, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: rgba(245, 241, 232, 0.7);
      font-size: 14px;
      line-height: 1.55;
    }
    a {
      color: #f2d98a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand-mark">C</div>
      <h1>Resource Reporting is temporarily offline</h1>
      <p>
        This tool is undergoing maintenance and is not available right now.
        Please check back soon, or contact
        <a href="mailto:garrett@cadmusprojects.com">garrett@cadmusprojects.com</a>
        with any questions.
      </p>
    </div>
  </div>
</body>
</html>
